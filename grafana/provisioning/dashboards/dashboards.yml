apiVersion: 1

providers:
  - name: 'Log Collector Dashboards'
    orgId: 1
    folder: 'Log Collector Dashboards'
    folderUid: 'log-collection'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards