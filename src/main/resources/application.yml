server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: log-collector
    generator:
      enabled: false
  datasource:
    url: jdbc:postgresql://postgres:5432/logdb
    username: loguser
    password: logpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: log-collector-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-create-topics: true
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.example.logcollector: DEBUG
    org.springframework.kafka: INFO
    org.flywaydb: DEBUG
    org.springframework.orm.jpa: DEBUG

app:
  log:
    max-batch-size: 1000
    retention-days: 30
    parsers:
      enabled:
        - json
        - syslog
        - clf
  ingestion:
    file:
      watch-dir: logs
      poll-interval: 30000
    kafka:
      topics: logs_raw
  generator:
    generator:
      # Для HTTP генератора - используем разные URL в зависимости от контекста
      http:
        # Внутри Docker сети используйте 'app', с хоста - 'localhost'
        url: http://app:8080/api/v1/logs
      kafka:
        topic: logs_raw
        bootstrap-servers: kafka:9092
      file:
        output-dir: ./logs
      enabled: true
      rate: 10
      sources: auth-service,payment-service,order-service,user-service,api-gateway
      levels: INFO,ERROR,WARN,DEBUG
  etl:
    validation:
      required-fields: level,source,message,createdAt
    deduplication:
      enabled: true
      window-seconds: 60  # Окно дедупликации 60 секунд